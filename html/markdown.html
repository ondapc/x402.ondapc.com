<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown your html for AI reading and storage</title>
  <!-- Bootstrap 5 CSS (light, no extra theme) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Optional: Font Awesome for a clean search icon (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/html/style.css">
</head>
<body>
<form action="/markdown/pay" method="GET">
  <div class="center-wrapper">
    <div class="search-card">
      <h5 class="text-center mb-4 fw-light text-secondary">
		  <i class="fa-solid fa-infinity fa-2x"></i><br/> Markdown a URL for AI's to read and store
	  </h5>
      <div class="input-group input-group-primary">

        <span class="input-group-text primary-icon"><i class="fa-solid fa-link fa-2x"></i></span>

        <input type="text" class="form-control form-control-lg" 
			   name="url" 
               placeholder="Enter a URL in html format for markdown..." 
               aria-label="html to markdown service" 
               aria-describedby="submit-icon">
        
        <button class="btn btn-primary btn-lg" type="submit"><i class="fa-solid fa-angles-right"></i></button>
        
      </div>
      
      <!-- small hint / extra primary accent (optional) -->
      <div class="text-center mt-3 text-muted small">
        <span class="badge bg-primary-subtle text-primary-emphasis px-3 py-2 rounded-pill">
          <i class="fa-brands fa-markdown"></i> Results will be markdown format text
        </span>
      </div>
    </div>
  </div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
