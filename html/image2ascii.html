<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Ascii Color Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
  background-color: #0000;
  color: #fff;
}
  </style>
</head>
<body class="bg-light d-flex align-items-center vh-100" data-bs-theme="dark">


  <div class="container d-flex justify-content-center align-items-center">
    <div class="upload-card text-center">

      <div class="mb-3 hint-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="currentColor" class="bi bi-image" viewBox="0 0 16 16">
          <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
          <path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13zm13 1a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13z"/>
        </svg>
      </div>

      <h5 class="mb-3 fw-normal text-secondary">Upload an image</h5>

     <form method="post" enctype="multipart/form-data" action="/img2ascii/pay">
	  <input type="hidden" name="sent" />
	  <input id="uploadFile" placeholder="Choose Image" disabled="disabled" type="hidden" />
        <div class="mb-3">
          <input class="form-control form-control-lg upload" 
                 id="uploadBtn" 
                 type="file" 
                 id="imageUpload" 
                 name="image" 
                 accept="image/*" 
                 aria-label="Image file upload" required>
          <div class="form-text text-start mt-1">
            <small>Accepted: JPG, PNG, GIF, SVG, WebP 1.5 MB max</small>
			<script>
			$(document).ready(function() {
				document.getElementById("uploadBtn").onchange = function () {
					document.getElementById("uploadFile").value = this.value;
				};
			});
			</script>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 py-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cloud-arrow-up me-1" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M7.646 10.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 9.293V4.5a.5.5 0 0 0-1 0v4.793L5.354 7.146a.5.5 0 1 0-.708.708l3 3z"/>
            <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
          </svg>
          Upload image
        </button>
      </form>

      <p class="mt-3 mb-0 small text-muted">only image files accepted</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
